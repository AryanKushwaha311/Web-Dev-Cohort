<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=], initial-scale=1.0">
  <title>Document</title>
  <style>
    .box-1{
      background: red;
      height: 50px;
    }
    .parent{
      display: flex;
      background: yellow;
    }
    .child{
      background: green;
      margin-right: 10px;
      flex: 1;
    }
    .box-2{
      background-color: blue;
      height: 50px;
    }
  </style>
</head>
<body>
    <div class="box-1">Box1</div>
    <div class="parent">
      <div class="child">A</div>
      <div class="child">B</div>
      <div class="child">C</div>
    </div>

    <div class="box-2">Box2</div>
</body>
</html>
